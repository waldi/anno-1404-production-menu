name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Production Menu
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package both editions
        shell: pwsh
        run: ./tools/ci.ps1 -Product production-menu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-menu
          path: |
            dist/production-calculator/Production-Menu-*.zip
            dist/production-calculator/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  studio:
    name: GUI Studio
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/gui_editor/package-lock.json
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Test, build and package standalone editor
        shell: pwsh
        run: ./tools/ci.ps1 -Product gui-studio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-studio
          path: |
            dist/gui-studio/Anno-GUI-Studio-*.zip
            dist/gui-studio/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  source:
    name: Source audit
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/ci.ps1 -Product research
