name: Release production-menu
on:
  push:
    tags: ['production-menu-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and license
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content tools/release-versions.json -Raw | ConvertFrom-Json).'production-menu'
          if ($env:RELEASE_TAG -cne "production-menu-v$version") { throw 'Version/tag mismatch' }
          if (-not (Test-Path LICENSE)) { throw 'License required' }
      - name: Test and package
        shell: pwsh
        run: ./tools/ci.ps1 -Product research; ./tools/ci.ps1 -Product production-menu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/production-calculator/Production-Menu-*.zip
            dist/production-calculator/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/release-assets
      - name: Publish tested assets as a prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./tools/publish-release.ps1 -Product production-menu -Tag $env:RELEASE_TAG -Repository $env:RELEASE_REPOSITORY -AssetDirectory dist/release-assets
